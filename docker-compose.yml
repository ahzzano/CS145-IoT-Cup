services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app/frontend
    volumes:
      - .:/app
      - frontend_node_modules:/app/frontend/node_modules
      - frontend_sveltekit:/app/frontend/.svelte-kit
    ports:
      - "3000:3000"
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    command: npm run dev -- --host 0.0.0.0

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app/backend
    volumes:
      - .:/app
      - backend_venv:/app/backend/.venv
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - FLASK_ENV=development
    command: uv run python app.py
    develop:
      watch:
        - action: sync 
          path: ./backend
          target: /app/backend/
          ignore:
            -  __pycache__
            - .venv

volumes:
  frontend_node_modules:
  frontend_sveltekit:
  backend_venv:
